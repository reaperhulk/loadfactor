# The deep build-fuzz hunt, on a schedule. CI runs a light sweep on every
# push; this job runs the real evolutionary search weekly and on harness
# changes so a curve-breaking build can't hide between manual hunts. If a
# genome exceeds the runaway cap, reproduce with the logged genome and options
# (the search is deterministic), fix the curve, and pin the genome.
name: Deep fuzz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuzz.yml'
      - 'src/harness/fuzz.ts'
      - 'src/harness/__tests__/fuzz.test.ts'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fuzz:builds
